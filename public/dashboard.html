<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Brief Pipeline - Ops Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-4">
    <header class="bg-white border border-slate-200 rounded-lg p-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div class="flex items-center gap-2">
          <i data-lucide="activity" class="w-5 h-5"></i>
          <h1 class="text-lg font-semibold">SEO Brief Pipeline - Operaciones</h1>
        </div>
        <div id="healthBadge" class="text-sm text-slate-600">Comprobando API...</div>
      </div>
      <div class="grid md:grid-cols-3 gap-3 mt-3">
        <label class="text-sm">
          <span class="block mb-1">API Base URL</span>
          <input id="apiUrl" class="w-full border border-slate-300 rounded px-3 py-2">
        </label>
        <label class="text-sm md:col-span-2">
          <span class="block mb-1">X-API-Key</span>
          <input id="apiKey" type="password" class="w-full border border-slate-300 rounded px-3 py-2">
        </label>
      </div>
      <div class="mt-3 flex gap-2">
        <button id="saveConfigBtn" class="px-3 py-2 bg-slate-800 text-white rounded text-sm">Guardar Config</button>
        <button id="checkHealthBtn" class="px-3 py-2 border border-slate-300 rounded text-sm">Health</button>
      </div>
    </header>

    <section class="bg-white border border-slate-200 rounded-lg p-4">
      <h2 class="font-semibold mb-3 flex items-center gap-2"><i data-lucide="file-plus-2" class="w-4 h-4"></i>Nuevo Briefing</h2>
      <form id="briefForm" class="grid md:grid-cols-4 gap-3">
        <input name="keyword" placeholder="keyword" required class="border border-slate-300 rounded px-3 py-2 text-sm">
        <input name="target_url" placeholder="target_url (opcional)" class="border border-slate-300 rounded px-3 py-2 text-sm">
        <input name="related_limit" type="number" min="5" max="100" value="30" class="border border-slate-300 rounded px-3 py-2 text-sm">
        <input name="serp_num" type="number" min="1" max="50" value="10" class="border border-slate-300 rounded px-3 py-2 text-sm">
        <label class="text-sm flex items-center gap-2">
          <input name="upload_to_sheets" type="checkbox" checked>
          Subir a Sheets
        </label>
        <div class="md:col-span-3">
          <button class="px-3 py-2 bg-indigo-600 text-white rounded text-sm">Lanzar /briefing</button>
        </div>
      </form>
      <div id="briefResult" class="mt-3 text-sm"></div>
      <div id="runStatus" class="mt-2 text-sm text-slate-700"></div>
    </section>

    <section class="bg-white border border-slate-200 rounded-lg p-4">
      <div class="flex flex-col md:flex-row md:items-end gap-3">
        <h2 class="font-semibold flex items-center gap-2"><i data-lucide="list" class="w-4 h-4"></i>Jobs</h2>
        <input id="filterStatus" placeholder="status: queued/running/done/failed" class="border border-slate-300 rounded px-3 py-2 text-sm md:w-64">
        <input id="filterQ" placeholder="buscar run_id/keyword" class="border border-slate-300 rounded px-3 py-2 text-sm md:w-64">
        <input id="filterLimit" type="number" min="1" max="200" value="20" class="border border-slate-300 rounded px-3 py-2 text-sm w-24">
        <button id="refreshJobsBtn" class="px-3 py-2 border border-slate-300 rounded text-sm">Refrescar</button>
        <button id="cleanupBtn" class="px-3 py-2 bg-amber-600 text-white rounded text-sm">Cleanup (30d)</button>
      </div>

      <div class="overflow-auto mt-3">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-50">
            <tr>
              <th class="text-left p-2">Run ID</th>
              <th class="text-left p-2">Keyword</th>
              <th class="text-left p-2">Status</th>
              <th class="text-left p-2">Step</th>
              <th class="text-left p-2">Updated</th>
              <th class="text-left p-2">Acciones</th>
            </tr>
          </thead>
          <tbody id="jobsTable"></tbody>
        </table>
      </div>
      <div class="mt-3 flex gap-2">
        <button id="nextPageBtn" class="px-3 py-2 border border-slate-300 rounded text-sm">Siguiente página</button>
        <span id="pageInfo" class="text-sm text-slate-600"></span>
      </div>
    </section>

    <section class="bg-white border border-slate-200 rounded-lg p-4">
      <h2 class="font-semibold mb-3 flex items-center gap-2"><i data-lucide="info" class="w-4 h-4"></i>Detalle de Job</h2>
      <div id="jobDetail" class="text-sm text-slate-700">Selecciona un job para ver detalle.</div>
      <h3 class="font-medium mt-4 mb-2">Eventos</h3>
      <div id="jobEvents" class="text-sm space-y-2"></div>
    </section>
  </div>

  <script>
    lucide.createIcons();
    const state = { cursor: 0, nextCursor: null, selectedRunId: null, lastRunId: null, pollingTimer: null };
    const byId = (id) => document.getElementById(id);
    const defaultApiUrl = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "http://localhost:8000"
      : location.origin;

    byId("apiUrl").value = localStorage.getItem("ops_api_url") || defaultApiUrl;
    byId("apiKey").value = localStorage.getItem("ops_api_key") || "";

    function saveConfig() {
      localStorage.setItem("ops_api_url", byId("apiUrl").value.trim());
      localStorage.setItem("ops_api_key", byId("apiKey").value);
    }

    function getConfig() {
      return { apiUrl: byId("apiUrl").value.trim(), apiKey: byId("apiKey").value };
    }

    function mapErrorMessage(error) {
      const msg = String(error?.message || "");
      if (msg.includes("403")) return "Auth fallida: revisa X-API-Key";
      if (msg.includes("422")) return "Validacion: revisa payload o filtros";
      if (msg.includes("409")) return "Transicion de estado no permitida";
      if (msg.includes("404")) return "Recurso no encontrado";
      if (msg.includes("429")) return "Rate limit alcanzado";
      return msg || "Error no controlado";
    }

    function showResultError(error) {
      byId("briefResult").textContent = `Error: ${mapErrorMessage(error)}`;
    }

    async function apiFetch(path, options = {}) {
      const { apiUrl, apiKey } = getConfig();
      const headers = { ...(options.headers || {}) };
      if (apiKey) headers["X-API-Key"] = apiKey;
      if (!headers["Content-Type"] && options.body) headers["Content-Type"] = "application/json";
      const response = await fetch(`${apiUrl}${path}`, { ...options, headers });
      if (!response.ok) {
        let detail = `${response.status}`;
        try {
          const body = await response.json();
          detail = body.detail || detail;
        } catch (_) {}
        throw new Error(detail);
      }
      return response.json();
    }

    async function checkHealth() {
      try {
        const { apiUrl } = getConfig();
        const data = await (await fetch(`${apiUrl}/health`)).json();
        byId("healthBadge").textContent = `API OK | cliente: ${data.active_client || "none"}`;
      } catch (_) {
        byId("healthBadge").textContent = "API no disponible";
      }
    }

    function renderJobs(items) {
      const tbody = byId("jobsTable");
      tbody.innerHTML = "";
      for (const job of items) {
        const tr = document.createElement("tr");
        tr.className = "border-b border-slate-100";
        tr.innerHTML = `
          <td class="p-2 font-mono text-xs">${job.run_id}</td>
          <td class="p-2">${job.keyword}</td>
          <td class="p-2">${job.status}</td>
          <td class="p-2">${job.step}</td>
          <td class="p-2 text-xs">${job.updated_at}</td>
          <td class="p-2">
            <div class="flex gap-1 flex-wrap">
              <button data-action="detail" data-run="${job.run_id}" class="px-2 py-1 border rounded text-xs">detalle</button>
              <button data-action="retry" data-run="${job.run_id}" class="px-2 py-1 border rounded text-xs">retry</button>
              <button data-action="cancel" data-run="${job.run_id}" class="px-2 py-1 border rounded text-xs">cancel</button>
              <button data-action="delete" data-run="${job.run_id}" class="px-2 py-1 border rounded text-xs text-red-700">delete</button>
            </div>
          </td>`;
        tbody.appendChild(tr);
      }
    }

    async function loadJobs() {
      const status = byId("filterStatus").value.trim();
      const q = byId("filterQ").value.trim();
      const limit = Number(byId("filterLimit").value || "20");
      const params = new URLSearchParams({ limit: String(limit), cursor: String(state.cursor) });
      if (status) params.set("status", status);
      if (q) params.set("q", q);
      const data = await apiFetch(`/jobs?${params.toString()}`);
      renderJobs(data.items);
      state.nextCursor = data.next_cursor;
      byId("pageInfo").textContent = `cursor=${state.cursor} count=${data.count} next=${data.next_cursor ?? "none"}`;
    }

    async function loadJobDetail(runId) {
      state.selectedRunId = runId;
      const [detail, events] = await Promise.all([
        apiFetch(`/jobs/${runId}`),
        apiFetch(`/jobs/${runId}/events?limit=50&cursor=0`)
      ]);
      byId("jobDetail").innerHTML = `
        <div><b>run_id:</b> ${detail.job.run_id}</div>
        <div><b>status:</b> ${detail.job.status}</div>
        <div><b>step:</b> ${detail.job.step}</div>
        <div><b>message:</b> ${detail.job.message}</div>
        <div><b>error_category:</b> ${detail.job.error_category || "-"}</div>
        <div><b>source_run_id:</b> ${detail.job.source_run_id || "-"}</div>`;
      byId("jobEvents").innerHTML = events.items.map((e) => `
        <div class="border border-slate-200 rounded p-2">
          <div class="font-mono text-xs">${e.created_at} | ${e.status} | ${e.step}</div>
          <div>${e.message}</div>
          <div class="text-xs text-slate-500">error_category=${e.error_category || "-"}</div>
        </div>`).join("") || "<div class='text-slate-500'>Sin eventos</div>";
    }

    async function pollRunStatus(runId) {
      if (state.pollingTimer) {
        clearTimeout(state.pollingTimer);
        state.pollingTimer = null;
      }
      try {
        const status = await apiFetch(`/briefing/${runId}`);
        byId("runStatus").textContent = `run=${runId} | status=${status.status} | step=${status.step || "-"} | message=${status.message || "-"}`;
        if (status.status === "done" || status.status === "failed") return;
        state.pollingTimer = setTimeout(() => pollRunStatus(runId), 2500);
      } catch (error) {
        byId("runStatus").textContent = `run=${runId} | error polling: ${mapErrorMessage(error)}`;
      }
    }

    async function createBriefing(form) {
      const payload = {
        keyword: form.keyword.value,
        target_url: form.target_url.value || null,
        related_limit: Number(form.related_limit.value),
        serp_num: Number(form.serp_num.value),
        upload_to_sheets: form.upload_to_sheets.checked,
      };
      const data = await apiFetch("/briefing", { method: "POST", body: JSON.stringify(payload) });
      byId("briefResult").innerHTML = `<span class="text-emerald-700">Run creado:</span> <span class="font-mono">${data.run_id}</span>`;
      state.lastRunId = data.run_id;
      byId("runStatus").textContent = `run=${data.run_id} | status=queued`;
      pollRunStatus(data.run_id).catch(() => {});
      state.cursor = 0;
      await loadJobs();
    }

    async function runCleanup() {
      const result = await apiFetch("/jobs/cleanup", {
        method: "POST",
        body: JSON.stringify({ max_age_days: 30, statuses: ["done", "failed"] }),
      });
      byId("briefResult").innerHTML = `Cleanup ejecutado: deleted_count=${result.deleted_count}`;
      await loadJobs();
    }

    byId("saveConfigBtn").addEventListener("click", () => { saveConfig(); checkHealth(); });
    byId("checkHealthBtn").addEventListener("click", checkHealth);
    byId("briefForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try { await createBriefing(e.target); } catch (err) { showResultError(err); }
    });
    byId("refreshJobsBtn").addEventListener("click", async () => {
      state.cursor = 0;
      try { await loadJobs(); } catch (err) { showResultError(err); }
    });
    byId("nextPageBtn").addEventListener("click", async () => {
      if (state.nextCursor == null) return;
      state.cursor = state.nextCursor;
      try { await loadJobs(); } catch (err) { showResultError(err); }
    });
    byId("cleanupBtn").addEventListener("click", async () => {
      if (!window.confirm("Ejecutar cleanup de jobs terminales (>30 dias)?")) return;
      try { await runCleanup(); } catch (err) { showResultError(err); }
    });
    byId("jobsTable").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      const runId = btn.dataset.run;
      try {
        if (action === "detail") await loadJobDetail(runId);
        if (action === "retry") { await apiFetch(`/jobs/${runId}/retry`, { method: "POST" }); await loadJobs(); }
        if (action === "cancel") {
          if (!window.confirm(`Cancelar job ${runId}?`)) return;
          await apiFetch(`/jobs/${runId}/cancel`, { method: "POST" });
          await loadJobs();
        }
        if (action === "delete") {
          if (!window.confirm(`Eliminar metadata del job ${runId}?`)) return;
          await apiFetch(`/jobs/${runId}`, { method: "DELETE" });
          if (state.selectedRunId === runId) {
            byId("jobDetail").textContent = "Selecciona un job para ver detalle.";
            byId("jobEvents").innerHTML = "";
          }
          await loadJobs();
        }
      } catch (err) {
        showResultError(err);
      }
    });

    saveConfig();
    checkHealth();
    loadJobs().catch(() => {});
  </script>
</body>
</html>

version: "3.9"

services:
  seo-pipeline-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo_pipeline_api
    restart: unless-stopped
    
    # Environment variables (override with .env file)
    environment:
      - API_KEY=${API_KEY:-secret-token-2025}
      - SEMRUSH_TOKEN=${SEMRUSH_TOKEN}
      - SERPAPI_KEY=${SERPAPI_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DFSP_USERNAME=${DFSP_USERNAME}
      - DFSP_PASSWORD=${DFSP_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-2025.11.18}
    
    # Port mapping
    ports:
      - "${PORT:-8000}:8000"
    
    # Persistent volumes
    volumes:
      - ./credentials:/app/credentials:ro  # Read-only credentials
      - ./data:/app/data                   # Cache and data
      - ./outputs:/app/outputs             # Generated briefings
      - ./runs:/app/runs                   # Run history
      - ./.env:/app/.env:ro                # Environment file (read-only)
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Network
    networks:
      - seo-pipeline-network

networks:
  seo-pipeline-network:
    driver: bridge
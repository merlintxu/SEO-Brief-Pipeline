[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-brief-pipeline"
version = "2025.11.18"
description = "Advanced SEO Briefing Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic[email]",
    "google-search-results>=2.4.2",
    "requests-cache>=1.2.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "gspread>=6.1.2",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.149.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "instructor>=1.3.3",
    "openai>=1.51.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "rich>=13.9.2",
    "tqdm>=4.66.5",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = "test_*.py"

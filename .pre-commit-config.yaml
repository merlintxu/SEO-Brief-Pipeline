repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: repo-guard
        name: repo-guard (secrets/forbidden tracked files)
        entry: python tools/check_repo_guard.py
        language: system
        pass_filenames: false
      - id: markdown-guard
        name: markdown-guard (basic markdown checks)
        entry: python tools/check_markdown.py
        language: system
        pass_filenames: false
